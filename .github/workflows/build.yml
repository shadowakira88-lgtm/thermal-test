name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ThermalTest-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: ThermalTest build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildlog-${{ github.run_number }}
          name: Build log ${{ github.run_number }}
          prerelease: true
          files: build.log
